<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manila Escalation Case</title>
<style>
:root{
  --bg:#EDF0F3; --card:#fff; --ink:#18232F; --muted:#586674; --line:#D3DAE1; --soft:#F5F7F9;
  --folder:#E6BC62; --folder-deep:#C69A3A;
  --cx:#0E6B73; --sp:#6C86A3; --ok:#2B7A4B; --warn:#8A5A00; --warn-bg:#FFF0CF; --bad:#A63A2B;
  --display:Bahnschrift,"DIN Alternate","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #1F5FBF;outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:22px 0 14px}
.top h1{margin:0;font:600 32px/1.05 var(--display);letter-spacing:.2px}
.top p{margin:4px 0 0;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.store{font-size:13px;color:var(--muted)}
button.store{border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.store.warn{color:var(--warn);background:var(--warn-bg);padding:3px 10px;border-radius:999px}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0}
.switch .track{width:38px;height:22px;border-radius:999px;background:#B9C3CD;position:relative;transition:background .15s}
.switch .track:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .track{background:var(--cx)}
.switch input:checked + .track:after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:3px solid #1F5FBF;outline-offset:2px}

/* manila folder tabs */
.tabs{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tab{appearance:none;border:1px solid var(--line);border-bottom:0;background:#DEE4EA;color:var(--muted);padding:9px 18px;margin-top:8px;border-radius:12px 12px 0 0;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.tab:hover{background:#E8ECF0;color:var(--ink)}
.tab[aria-selected=true]{background:var(--folder);border-color:var(--folder-deep);color:var(--ink);margin-top:0;padding-top:15px;padding-bottom:13px;margin-bottom:-4px;position:relative;z-index:1}
.sheet{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--folder);padding:26px 28px 44px;min-height:62vh;margin-bottom:40px}
@media(max-width:640px){.sheet{padding:18px 14px 32px}.top h1{font-size:26px}}

h2{font:600 22px/1.2 var(--display);margin:0 0 6px}
h3{font:600 16px/1.3 var(--body);margin:0 0 6px}
.lede{margin:0 0 18px;color:var(--ink)}
.lede b{font-weight:700}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 8px}

/* controls */
.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2A3A4B}
.btn.danger{color:var(--bad);border-color:#E3B8B1}
.btn.small{padding:4px 10px;font-size:13px}
.linklike{appearance:none;background:none;border:0;padding:0;color:#15508F;text-align:left;cursor:pointer;font-weight:600}
.linklike:hover{text-decoration:underline}
label.f{display:block;font-weight:600;font-size:13.5px}
label.f > span.l{display:block;margin-bottom:4px}
input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid #B7C1CB;border-radius:8px;padding:8px 10px;background:#fff;font-weight:400}
textarea{resize:vertical}
select.compact{width:auto;padding:5px 8px}
.monthpick{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.monthpick select{width:auto;min-width:170px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:#fff;padding:8px 18px;font-weight:600;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}

/* chips */
.chip{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:700;color:#fff}
.chip.cx{background:var(--cx)} .chip.sp{background:var(--sp)} .chip.none{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.st{font-weight:700;font-size:13px;white-space:nowrap}
.st.verified{color:var(--ok)} .st.waiting{color:var(--warn)} .st.notcounted{color:var(--muted)}
.st.waiting:before,.st.verified:before,.st.notcounted:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}
.st.notcounted:before{background:none;border:2px solid currentColor;width:9px;height:9px}

/* tables */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:13px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--ink);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#FAFBFC}
tr.fresh{background:#FFF8E3}
tfoot td,tfoot th{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}

/* dashboard */
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:0 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.board td.scorecell{min-width:220px}
.board .sc{display:flex;align-items:center;gap:12px}
.board .sc b{font:600 26px/1 var(--display);min-width:38px;text-align:right}
.board .bar{flex:1;height:16px;background:var(--soft);border-radius:4px;display:flex;overflow:hidden}
.board .bar i{display:block;height:100%}
.board .bar i.c{background:var(--cx)} .board .bar i.s{background:var(--sp)}
.board th[scope=row]{font-weight:600}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:34px;margin-top:34px}
@media(max-width:900px){.grid2{grid-template-columns:1fr;gap:26px}}
.days{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid var(--ink);padding-top:6px;overflow-x:auto}
.day{flex:1 0 14px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.day .col{display:flex;flex-direction:column;justify-content:flex-end}
.day .col i{display:block;width:100%}
.day .col i.c{background:var(--cx)} .day .col i.s{background:var(--sp)} .day .col i.n{background:#B9C3CD}
.daylabels{display:flex;gap:3px;font-size:11px;color:var(--muted);overflow:hidden}
.daylabels span{flex:1 0 14px;text-align:center}
.grid2 > *{min-width:0}
.timing{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.timing .tb{height:14px;background:var(--ink);border-radius:3px;min-width:2px}
.att{list-style:none;padding:0;margin:0}
.att li{padding:8px 0;border-bottom:1px solid var(--line)}
.att li:last-child{border-bottom:0}

/* cases */
.filters{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.filters .q{grid-column:span 1}
@media(max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.banner{background:#E6F2F3;border:1px solid #B5D6D9;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.concern{max-width:320px}
#caseBody td:nth-child(2){white-space:nowrap}
#caseBody td:last-child{white-space:nowrap;width:1%}
#caseBody td{padding:10px 8px}
.rowact .btn.small{padding:4px 8px}
@media(max-width:1200px){table:has(#caseBody) th:nth-child(6),#caseBody td:nth-child(6){display:none}.concern{max-width:260px}}
.concern .ids{font-size:12.5px}
.imgct{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--muted)}
.empty{padding:34px 10px;color:var(--muted)}

/* form */
.formgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px 16px;max-width:920px}
.formgrid > *{grid-column:span 2}
.formgrid .w3{grid-column:span 3} .formgrid .w6{grid-column:1/-1}
@media(max-width:760px){.formgrid > *,.formgrid .w3{grid-column:1/-1}}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types label{border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:block}
.types input{position:absolute;opacity:0}
.types label:has(input:checked){border-color:var(--ink);background:var(--soft)}
.types label:has(input:focus-visible){outline:3px solid #1F5FBF;outline-offset:2px}
.types b{display:block}
.types small{color:var(--muted)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.zones{grid-template-columns:1fr}}
.drop{border:2px dashed #9FAEBB;border-radius:10px;padding:18px 12px;text-align:center;color:var(--muted);cursor:pointer;background:var(--soft)}
.drop:hover,.drop.over{border-color:var(--ink);color:var(--ink);background:#fff}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.thumbs figure{margin:0;position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.thumbs img{display:block;width:100%;height:84px;object-fit:cover;cursor:zoom-in}
.thumbs figcaption{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:3px 6px;font-size:12px}
.thumbs figcaption span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

/* loop */
.daychips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.daychips button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.daychips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.daychips button small{opacity:.7;font-weight:600;margin-left:4px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--soft);margin-top:26px}
.card.plain{background:#fff;margin-top:0}

/* chips, sums, leave */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;min-height:4px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid #B7C1CB;border-radius:999px;padding:2px 4px 2px 12px;font-weight:600;font-size:13px}
.tag button{appearance:none;border:0;background:#DCE2E8;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1;font-weight:700}
.tag button:hover{background:#C9D1D9}
.addrow{display:flex;gap:6px}
.supplist{list-style:none;margin:10px 0;padding:0;max-height:300px;overflow:auto}
.supplist li{display:flex;justify-content:space-between;align-items:center;padding:5px 2px;border-bottom:1px solid var(--line)}
.figbtns{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:2px 6px 4px;font-size:12.5px}
tr.sel{background:#FFF8E3}
.dual{display:flex;flex-direction:column;gap:3px;min-width:160px}
.dual i{display:block;height:7px;border-radius:2px}
.dual i.a{background:#B9C3CD}.dual i.b{background:var(--cx)}
.legend i.a{background:#B9C3CD}
table.lv{width:auto;min-width:100%}
.lv th,.lv td{padding:4px 2px;text-align:center;font-size:12px;border:1px solid var(--line);min-width:28px}
.lv th:first-child,.lv td:first-child{text-align:left;padding:6px 10px;min-width:190px;position:sticky;left:0;background:#fff}
.lv .we{background:#F1F3F5}
.lv td.k{color:#fff;font-weight:700}
.k-VL{background:#2F6DB5!important}.k-SL{background:#7B52A6!important}.k-EL{background:#B86E10!important}.k-ABS{background:#A63A2B!important}.k-RD{background:#6F7E8C!important}.k-PR{background:#D9EEDF!important;color:#1E5E3A!important}.lv td.k.k-PR{color:#1E5E3A;font-weight:600}.k-ML{background:#B0457A!important}.k-PL{background:#2E8B7A!important}
.lgd{display:inline-block;min-width:34px;text-align:center;border-radius:4px;color:#fff;font-weight:700;font-size:12px;padding:1px 6px;margin-right:6px}
details.card > summary{cursor:pointer;font-weight:700}
dl.meta dd{white-space:pre-wrap}

.rowimgs{display:flex;gap:4px;align-items:center}
.rowimgs button{appearance:none;border:1px solid var(--line);background:#fff;padding:0;border-radius:6px;overflow:hidden;cursor:zoom-in;width:44px;height:36px}
.rowimgs img{display:block;width:100%;height:100%;object-fit:cover}
.rowimgs .more{font-weight:700;font-size:12.5px;color:var(--muted)}
.rowact{display:flex;gap:6px;flex-wrap:nowrap}
.missing{display:flex;align-items:center;justify-content:center;height:84px;background:#FBEAE7;color:var(--bad);font-size:12px;padding:4px;text-align:center}
#lightbox .cap .nav{display:flex;gap:6px;align-items:center}
/* dialogs */
dialog{border:0;border-radius:12px;padding:0;max-width:min(860px,94vw);width:100%;box-shadow:0 20px 60px rgba(10,20,30,.35)}
dialog::backdrop{background:rgba(15,25,35,.55)}
.dlg{padding:22px 24px 20px;max-height:86vh;overflow:auto}
.dlg h2{margin-right:30px}
dl.meta{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:14px 0}
dl.meta dt{color:var(--muted);font-size:13.5px}
dl.meta dd{margin:0;overflow-wrap:anywhere}
#lightbox{max-width:96vw;width:auto;background:#0E151C}
#lightbox img{display:block;max-width:92vw;max-height:84vh;margin:0 auto}
#lightbox .cap{color:#D6DEE6;padding:8px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
#lightbox .btn{background:#fff}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#toast,.switch .track,.switch .track:after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Manila Escalation Case</h1>
      <p>Post cases, attach agent conversations, verify and score.</p>
    </div>
    <div class="top-right">
      <label class="switch"><input type="checkbox" id="verifier"><span class="track" aria-hidden="true"></span>Verify mode for Glenn</label>
      <button id="stale" class="store warn" data-act="refreshView" hidden>New changes from the team. Refresh</button>
      <span id="storeNote" class="store"></span>
      <span id="who" class="store"></span>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  <main class="sheet" id="view" role="tabpanel" tabindex="-1"></main>
</div>

<dialog id="detail"><div class="dlg" id="detailBody"></div></dialog>
<dialog id="lightbox"><div class="cap"><span id="lbCap"></span><span class="nav"><button class="btn small" data-act="lbPrev" id="lbPrev">Previous</button><button class="btn small" data-act="lbNext" id="lbNext">Next</button><button class="btn small" data-act="closeLb">Close</button></span></div><img id="lbImg" alt=""></dialog>
<dialog id="confirmDlg" style="max-width:440px"><div class="dlg"><p id="confirmMsg" style="margin-top:0"></p><div class="actions" style="margin-top:14px"><button class="btn danger" id="confirmOk">Confirm</button><button class="btn" id="confirmNo">Cancel</button></div></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<datalist id="suppList"></datalist>
<dialog id="suppDlg" style="max-width:460px"><div class="dlg"><h2>Supp list</h2>
  <p class="hint">Names suggested when you type in Colab / Tucson supp. Removing a name here does not change old cases.</p>
  <div class="addrow"><input type="text" id="suppNew" placeholder="Add a name" aria-label="New supp name"><button class="btn" data-act="suppAdd">Add</button></div>
  <ul class="supplist" id="suppItems"></ul><div class="actions" style="margin-top:8px"><button class="btn" data-act="closeSupp">Done</button></div></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

/* A VS ticket is an entry that starts with VS-1234, with or without the Jira link in front. Those are not counted. */

function periodOf(t) {

/* -------------------------------------------------------------- storage */
const Store = (() => {
  let db = null; const mem = { kv: {}, img: {} };
  const os = (st, mode) => db.transaction(st, mode).objectStore(st);
  const rq = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  return {
    get persistent() { return !!db; },
    async open() {
      try {
        db = await new Promise((ok, no) => {
          const r = indexedDB.open('manila-escalation-case', 1);
          r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('img'); };
          r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); r.onblocked = () => no(new Error('blocked'));
        });
      } catch (e) { db = null; }
    },
    async get(st, k) { if (!db) return mem[st][k]; try { return await rq(os(st, 'readonly').get(k)); } catch (e) { return mem[st][k]; } },
    async all(st) {
      if (!db) return { ...mem[st] };
      try { const ks = await rq(os(st, 'readonly').getAllKeys()), vs = await rq(os(st, 'readonly').getAll()); const o = {}; ks.forEach((k, i) => o[k] = vs[i]); return o; }
      catch (e) { return { ...mem[st] }; }
    },
    async put(st, k, v) { mem[st][k] = v; if (db) { try { await rq(os(st, 'readwrite').put(v, k)); } catch (e) { console.warn(e); } } },
    async del(st, k) { delete mem[st][k]; if (db) { try { await rq(os(st, 'readwrite').delete(k)); } catch (e) {} } },
    async clear(st) { mem[st] = {}; if (db) { try { await rq(os(st, 'readwrite').clear()); } catch (e) {} } }
  };
})();

function setMonth(m) { ui.month = m; ui.f.month = m; ui.loopMonth = m; ui.leaveMonth = m; if (ui.exportMonth !== 'all') ui.exportMonth = m; }

function normalizeCase(c) {
  if (!Array.isArray(c.colab)) c.colab = c.colab ? [String(c.colab).trim()].filter(Boolean) : [];
  if (!Array.isArray(c.images)) c.images = [];
}
function normalize() {
  S.loop ||= []; S.leave ||= []; S.supps ||= []; S.cases ||= [];
  S.cases.forEach(normalizeCase);
  const seen = new Set(); S.loop = S.loop.filter(r => { r.id ||= loopId(r.date, r.email, r.issue); if (seen.has(r.id)) return false; seen.add(r.id); return true; });
  if (!S.suppsMerged) { const set = new Set(S.supps); S.cases.forEach(c => c.colab.forEach(n => set.add(n.toUpperCase()))); S.supps = [...set].sort(); S.suppsMerged = true; }
}
const loopRows = () => S.loop.filter(r => !isVS(r.email));
function cameIn(pred) { const s = new Set(); loopRows().forEach(r => { if (pred(r.date)) s.add(r.email.trim().toLowerCase()); }); return s.size; }
const cameOrNull = pred => loopRows().some(r => pred(r.date)) ? cameIn(pred) : null;
function loopDistinct(month) { return cameIn(d => d.startsWith(month)); }
function periodRows(view, month) {
  const dates = new Set([...loopRows().map(r => r.date), ...S.cases.map(c => c.date).filter(Boolean)]);
  const hand = pred => { const cs = S.cases.filter(c => c.date && pred(c.date)); return { n: cs.length, v: cs.filter(isVerified).length }; };
  if (view === 'day') return [...dates].filter(d => !month || d.startsWith(month)).sort().reverse().map(d => { const h = hand(x => x === d); return { key: d, label: fmtDay(d, { weekday: 'short', month: 'short', day: 'numeric' }), came: cameOrNull(x => x === d), handled: h.n, verified: h.v }; });
  if (view === 'week') return [...new Set([...dates].map(weekStart))].sort().reverse().map(w => { const e = addDays(w, 6), f = x => x >= w && x <= e, h = hand(f); return { key: w, label: `${fmtDay(w)} to ${fmtDay(e)}`, came: cameOrNull(f), handled: h.n, verified: h.v }; });
  const ms = [...new Set([...[...dates].map(d => d.slice(0, 7)), ...monthsList()])].sort().reverse();
  return ms.map(m => { const cs = S.cases.filter(c => c.month === m); return { key: m, label: monthLabel(m), came: cameOrNull(d => d.startsWith(m)), handled: cs.length, verified: cs.filter(isVerified).length }; });
}
function monthStats(month) {
  const cs = S.cases.filter(c => c.month === month), loopN = loopDistinct(month);
  const leads = [...new Set([...DEFAULT_LEADS, ...cs.map(c => c.lead)])].filter(Boolean);
  const rows = leads.map(lead => {
    const mine = cs.filter(c => c.lead === lead), v = mine.filter(isVerified);
    const complex = v.filter(c => c.type === 'Complex').length, simple = v.filter(c => c.type === 'Simple').length;
    return { lead, posted: mine.length, verified: v.length, complex, simple,
             waiting: mine.filter(c => statusOf(c) === 'waiting').length,
             score: complex * POINTS.Complex + simple * POINTS.Simple, share: loopN ? v.length / loopN : null };
  }).sort((a, b) => b.score - a.score || b.verified - a.verified || a.lead.localeCompare(b.lead));
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  const total = { posted: sum('posted'), verified: sum('verified'), complex: sum('complex'), simple: sum('simple'),
                  waiting: sum('waiting'), score: sum('score'), share: loopN ? sum('verified') / loopN : null };
  return { rows, total, loopN, cs };
}

function fileToData(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let max = 1400, q = 0.8, out = '';
      for (let n = 0; n < 8; n++) {   // keep each image under about 850 KB so it fits one database record
        const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
        out = cv.toDataURL('image/jpeg', q); if (out.length < 850000) break;
        max = Math.round(max * 0.8); q = Math.max(0.55, q - 0.05);
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Not an image')); };
    img.src = url;
  });
}

    return c.textContent.replace(/\u00a0/g, ' ').trim();

}
function parseTSV(text) {

}

function flush() {

    const last = Cloud.last[name], seen = new Set();

  const ss = stable({ supps: S.supps || [] });
  if (ss !== Cloud.lastSettings) { ops.push(['set', 'meta', 'settings', JSON.parse(ss)]); Cloud.lastSettings = ss; }
  for (let i = 0; i < ops.length; i += 400) {

const MON3 = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
function sheetMonth(name) {

}
const xlStr = v => (typeof v === 'number' && Number.isInteger(v) ? String(v) : String(v == null ? '' : v)).replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
function xlDate(v) {
  if (v === '' || v == null) return '';

}
function xlTime(v) {

  if (typeof v === 'number') { const m = Math.round((v % 1) * 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; }
  if (v instanceof Date) return `${pad(v.getHours())}:${pad(v.getMinutes())}`;

}
const caseKey = c => [c.month, c.date, c.time, c.lead, (c.concern || '').toLowerCase()].join('|');
function parseCaseSheet(ws, month) {

      serviceId: xlStr(at(r, 'sid')), caseNo: xlStr(at(r, 'cno')), concern: xlStr(at(r, 'concern')), type: /^complex$/i.test(type) ? 'Complex' : /^simple$/i.test(type) ? 'Simple' : '',

function teardown() {

  S = { cases: [], loop: [], supps: [], leave: [] }; IMG = {}; Cloud.last = { cases: {}, loop: {}, leave: {} }; Cloud.lastSettings = '';

  $('#view').innerHTML = '<p class="empty">Loading…</p>';

const CLOUD_TIMEOUT = window.__cloudTimeout || 15000;
const withTimeout = (p, ms = CLOUD_TIMEOUT) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('Timed out'), { code: 'timeout' })), ms))]);
function explain(e) {

  if (c === 'permission-denied') return 'The database refused access. Publish the security rules from firestore.rules and make sure Anonymous sign-in is enabled. ' + fix;
  if (c === 'timeout' || c === 'unavailable') return 'The page could not reach the database. Check your internet connection, then: ' + fix;
  if (c === 'not-found' || c === 'failed-precondition') return 'The Firestore database does not seem to exist yet. ' + fix;
  return ((e && e.message) || 'Unknown error') + (c ? ` (${c}). ` : '. ') + fix;
}
function authExplain(e) {
  const c = (e && e.code) || '', where = location.protocol === 'file:' ? ' You are opening the page as a file on your computer; hosting it at a web address (for example Firebase Hosting) is more reliable.' : '';
  let m;
  if (['auth/operation-not-allowed', 'auth/admin-restricted-operation'].includes(c)) m = 'Anonymous sign-in is turned off. In Firebase open Build > Authentication > Sign-in method, then enable Anonymous.';
  else if (c === 'auth/configuration-not-found') m = 'Authentication has not been set up in this Firebase project. Open Build > Authentication, click Get started, then enable Anonymous.';
  else if (['auth/api-key-not-valid', 'auth/invalid-api-key'].includes(c)) m = 'Firebase rejected the API key in this file. Check the FIREBASE_CONFIG values near the top of the file.';
  else if (c === 'auth/network-request-failed') m = 'The request to Google was blocked or failed. A company network or proxy may block Google sign-in (identitytoolkit.googleapis.com) or Firestore. Try another network, or ask IT to allow these Google addresses.';

function cloudFail(msg, e) { console.error(e); $('.switch').hidden = true; $('#storeNote').textContent = 'Not connected'; $('#storeNote').classList.add('warn'); $('#view').innerHTML = `<h2>Could not connect to the shared database</h2><p class="muted" style="max-width:720px">${esc(msg)}</p><button class="btn primary" onclick="location.reload()">Try again</button>`; }
async function startSession(user) {
  const { F, db } = Cloud;

  Cloud.user = user; Cloud.isVerifier = true;
  $('.switch').hidden = false; ui.verifier = false; $('#verifier').checked = false;
  S = { cases: [], loop: [], supps: [], leave: [] };
  const firsts = [];
  const watch = (src, fn) => firsts.push(new Promise(res => { let first = true; const done = () => { if (first) { first = false; res(); } };

async function bootCloud() {

async function bootLocal() {
  await Store.open();

(CLOUD ? bootCloud : bootLocal)();
